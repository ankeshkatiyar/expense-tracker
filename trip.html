---
layout: null
permalink: /trip/
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Shared trip · {{ site.app_name }}</title>
  <style>
    :root { color-scheme: light dark; --accent: #4f46e5; --card: #ffffff; --bg: #f2f2f7; --muted: #6b7280; --line: #e5e7eb;
            --green: #16a34a; --orange: #ea580c; }
    @media (prefers-color-scheme: dark) { :root { --card: #1c1c1e; --bg: #000; --muted: #9ca3af; --line: #2c2c2e; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    .card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
    h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
    .muted { color: var(--muted); font-size: 14px; }
    .total { font-size: 32px; font-weight: 700; margin-top: 10px; font-variant-numeric: tabular-nums; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    .row:first-of-type { border-top: 0; }
    .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
    .gets { color: var(--green); } .owes { color: var(--orange); }
    .settle { font-weight: 600; }
    .cta { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none;
           font-weight: 600; padding: 14px; border-radius: 14px; }
    .center { text-align: center; padding: 48px 16px; }
  </style>
</head>
<body>
<main id="app"><p class="center muted">Loading trip…</p></main>
<script>
  // Read-only trip summary for a share link (?t=<token>). Data comes from the
  // get_shared_trip() function in Supabase/v7_growth.sql; nothing is stored here.
  const SUPABASE_URL = "https://frejpvygpkzsednbwfox.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_fklxVwzZEBfmWC3YM99jZA_-apO467_";
  const app = document.getElementById("app");

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
    children.forEach(c => node.append(c instanceof Node ? c : document.createTextNode(String(c))));
    return node;
  }

  function message(title, text) {
    app.replaceChildren(el("div", { class: "card center" }, el("h1", {}, title), el("p", { class: "muted" }, text)));
  }

  // Greedy settle-up: biggest debtor pays biggest creditor (same idea as the apps).
  function settleUp(people) {
    const debtors = people.filter(p => p.net < 0).map(p => ({ ...p, left: -p.net })).sort((a, b) => b.left - a.left);
    const creditors = people.filter(p => p.net > 0).map(p => ({ ...p, left: p.net })).sort((a, b) => b.left - a.left);
    const moves = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const amount = Math.min(debtors[i].left, creditors[j].left);
      if (amount > 0) moves.push({ from: debtors[i].name, to: creditors[j].name, amount });
      debtors[i].left -= amount; creditors[j].left -= amount;
      if (debtors[i].left === 0) i++;
      if (creditors[j].left === 0) j++;
    }
    return moves;
  }

  async function load() {
    const token = new URLSearchParams(location.search).get("t");
    if (!token) return message("Link incomplete", "Ask for the trip link again.");
    let trip;
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_shared_trip", {
        method: "POST",
        headers: { "apikey": PUBLISHABLE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_token: token }),
      });
      if (!res.ok) throw new Error(res.status);
      trip = await res.json();
    } catch (e) {
      return message("Couldn't load the trip", "Check your connection and try again.");
    }
    if (!trip) return message("This link isn't active", "The trip may have been deleted or the owner stopped sharing it.");

    // The apps store every currency in hundredths (paise, cents).
    const money = minor => {
      try { return new Intl.NumberFormat("en-IN", { style: "currency", currency: trip.currency || "INR" }).format(minor / 100); }
      catch (e) { return (minor / 100).toFixed(2) + " " + (trip.currency || ""); }
    };
    // Trip dates are calendar days ("2026-11-12"); expense times are moments.
    const dayFmt = d => new Date(d + "T00:00:00Z").toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" });
    const dateFmt = d => new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short" });
    const people = trip.people.map(p => ({
      id: p.id, name: p.name,
      paid: p.paid_minor, net: p.paid_minor - p.share_minor + p.sent_minor - p.received_minor,
    }));
    const categoryName = id => (id || "Other").replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
    const names = Object.fromEntries(people.map(p => [p.id, p.name]));
    const total = trip.expenses.reduce((sum, e) => sum + e.amount_minor, 0);
    document.title = trip.name + " · Shared trip";

    const header = el("div", { class: "card" },
      el("h1", {}, trip.name),
      el("div", { class: "muted" }, `${dayFmt(trip.start_date)} – ${dayFmt(trip.end_date)} · ${people.length} people${trip.ended ? " · ended" : ""}`),
      el("div", { class: "total" }, money(total)),
      el("div", { class: "muted" }, `spent across ${trip.expenses.length} expense${trip.expenses.length === 1 ? "" : "s"}`));

    const moves = settleUp(people);
    const settle = el("div", { class: "card" }, el("h2", {}, "Who owes whom"));
    if (moves.length === 0) settle.append(el("div", { class: "row" }, "Everyone is settled up 🎉"));
    moves.forEach(m => settle.append(el("div", { class: "row settle" },
      el("span", {}, `${m.from} pays ${m.to}`), el("span", { class: "amt" }, money(m.amount)))));

    const balances = el("div", { class: "card" }, el("h2", {}, "Balances"));
    people.forEach(p => balances.append(el("div", { class: "row" },
      el("span", {}, p.name, el("div", { class: "muted" }, `paid ${money(p.paid)}`)),
      el("span", { class: "amt " + (p.net > 0 ? "gets" : p.net < 0 ? "owes" : "") },
        p.net > 0 ? `gets ${money(p.net)}` : p.net < 0 ? `owes ${money(-p.net)}` : "settled"))));

    const list = el("div", { class: "card" }, el("h2", {}, "Expenses"));
    if (trip.expenses.length === 0) list.append(el("div", { class: "row muted" }, "Nothing spent yet."));
    trip.expenses.forEach(e => list.append(el("div", { class: "row" },
      el("span", {}, e.merchant || categoryName(e.category), el("div", { class: "muted" }, `${dateFmt(e.spent_at)} · paid by ${names[e.paid_by] || "someone"}`)),
      el("span", { class: "amt" }, money(e.amount_minor)))));

    const cta = el("div", { class: "card" },
      el("p", { class: "muted", style: "margin-top:0" }, "Record payments and add expenses with the free Spendloom app."),
      el("a", { class: "cta", href: "{{ '/' | relative_url }}" }, "Get Spendloom"));

    app.replaceChildren(header, settle, balances, list, cta);
  }
  load();
</script>
</body>
</html>
