<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.app_name }}</title>
  <style>
    :root { color-scheme: light dark; --accent: #4f46e5; }
    body { font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    header { display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline;
             border-bottom: 1px solid #8884; padding-bottom: 12px; margin-bottom: 24px; }
    header strong { font-size: 20px; margin-right: auto; }
    a { color: var(--accent); }
    table { border-collapse: collapse; width: 100%; font-size: 15px; }
    th, td { border: 1px solid #8885; padding: 8px; text-align: left; vertical-align: top; }
    h1 { line-height: 1.2; }
    .muted { opacity: .7; font-size: 15px; }
    footer { margin-top: 48px; font-size: 14px; opacity: .7; }
  </style>
</head>
<body>
  <header>
    <strong>{{ site.app_name }}</strong>
    <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
    <a href="{{ '/terms/' | relative_url }}">Terms</a>
    <a href="{{ '/support/' | relative_url }}">Support</a>
  </header>
  {{ content }}
  <footer>© {{ 'now' | date: '%Y' }} {{ site.owner_name }} · <a href="mailto:{{ site.support_email }}">{{ site.support_email }}</a></footer>
</body>
</html>
